name: PowerGym CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - PwrGymCodex

concurrency:
  group: powergym-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI verification
        run: npm run verify:ci

      - name: Generate release evidence
        if: always()
        shell: bash
        run: |
          mkdir -p release-evidence
          node scripts/code-maintenance-audit.mjs --json > release-evidence/code-maintenance-audit.json
          npm run ops:production-readiness -- --output=release-evidence/production-readiness.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powergym-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
